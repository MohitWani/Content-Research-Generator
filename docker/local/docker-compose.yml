services:
  python-fast-api-seeds-app:
    image: ai-services-${ENV_NAME}:${APP_VERSION}
    container_name: python-fast-api-seeds-app-${ENV_NAME}
    build:
      context: ../../
      dockerfile: docker/local/Dockerfile
      args:
        - APP_VERSION=${APP_VERSION}
        - ENV_NAME=${ENV_NAME}
        - APP_PORT=${APP_PORT}
    ports:
      - "${APP_PORT}:${APP_PORT}"
      - "5678:5678"  # <== debugpy
    env_file:
      - ../../.env
    volumes:
      - ../../volumes/${ENV_NAME}/logs:/app/logs
      - ../../volumes/${ENV_NAME}/data:/app/data
      - ../../volumes/${ENV_NAME}/data/uploads:/app/uploads
      - ../../:/app/
    restart: unless-stopped
    command: >
      python -m debugpy --listen 0.0.0.0:5678 --wait-for-client -m uvicorn main:app --host 0.0.0.0 --port ${APP_PORT} --reload
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT}/api/health/ai-service"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - python-fast-api-seeds-app-network

  mysql:
    image: mysql:8.0
    container_name: mysql-${ENV_NAME}
    ports:
      - "3307:3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Admin
      MYSQL_DATABASE: ai_services_db
    volumes:
      - ~/docker-volumes/${ENV_NAME}/mysql_data:/var/lib/mysql
    networks:
      - python-fast-api-seeds-app-network

networks:
  python-fast-api-seeds-app-network:
    name: ${ENV_NAME}-network
    driver: bridge
