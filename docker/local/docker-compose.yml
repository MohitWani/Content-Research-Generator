services:
  app:
    image: ai-research-agent-${ENV_NAME}:${APP_VERSION}
    container_name: ai-research-agent-${ENV_NAME}
    depends_on:
      - postgres
    build:
      context: ../../
      dockerfile: docker/local/Dockerfile
      args:
        - APP_VERSION=${APP_VERSION}
        - ENV_NAME=${ENV_NAME}
        - APP_PORT=${APP_PORT}
    ports:
      - "${APP_PORT}:${APP_PORT}"
      - "5678:5678"  # debugpy
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/research_db
    volumes:
      - ../../volumes/${ENV_NAME}/logs:/app/logs
      - ../../volumes/${ENV_NAME}/data:/app/data
      - ../../app:/app/app
      - ../../database:/app/database
      - ../../migrations:/app/migrations
      - ../../main.py:/app/main.py
      - ../../entrypoint.sh:/app/entrypoint.sh
      - ../../alembic.ini:/app/alembic.ini
    restart: unless-stopped
    command: >
      uv run uvicorn main:app --host 0.0.0.0 --port ${APP_PORT} --reload
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT}${APP_ROOT_PATH}/api/health/ai-service"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - research-network
    

  postgres:
    image: postgres:15-alpine
    container_name: postgres-${ENV_NAME}
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init-multiple-dbs:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - research-network

volumes:
  postgres_data:

networks:
  research-network:
    name: ${ENV_NAME}-research-network
    driver: bridge
