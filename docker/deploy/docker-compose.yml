version: '3.8'

services:
  python-fast-api-seeds-app:
    image: ai-services-${ENV_NAME}:${APP_VERSION}
    container_name: python-fast-api-seeds-app-${ENV_NAME}
    build:
      context: ../../
      dockerfile: docker/deploy/Dockerfile
      args:
        - APP_VERSION=${APP_VERSION}
        - ENV_NAME=${ENV_NAME}
        - APP_PORT=${APP_PORT}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - ../../.env
    volumes:
      - ../../volumes/${ENV_NAME}/logs:/app/logs
      - ../../volumes/${ENV_NAME}/data:/app/data
      - ../../volumes/${ENV_NAME}/data/uploads:/app/uploads
    restart: unless-stopped
    command: >
      uvicorn main:app --host 0.0.0.0 --port ${APP_PORT} --workers 2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT}/api/health/ai-service"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - python-fast-api-seeds-app-network

networks:
  python-fast-api-seeds-app-network:
    name: ${ENV_NAME}-network
    driver: bridge