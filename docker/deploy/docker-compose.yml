version: '3.8'

services:
  app:
    image: ai-research-agent-${ENV_NAME}:${APP_VERSION}
    container_name: ai-research-agent-${ENV_NAME}
    build:
      context: ../../
      dockerfile: docker/deploy/Dockerfile
      args:
        - APP_VERSION=${APP_VERSION}
        - ENV_NAME=${ENV_NAME}
        - APP_PORT=${APP_PORT}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/research_db
    volumes:
      - ../../volumes/${ENV_NAME}/logs:/app/logs
      - ../../volumes/${ENV_NAME}/data:/app/data
    restart: unless-stopped
    command: >
      uv run uvicorn main:app --host 0.0.0.0 --port ${APP_PORT} --workers 2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - research-network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: postgres-${ENV_NAME}
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - research-network

volumes:
  postgres_data:

networks:
  research-network:
    name: ${ENV_NAME}-research-network
    driver: bridge
