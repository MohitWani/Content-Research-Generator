[project]
name = "ai-research-agent"
version = "0.1.0"
description = "AI Research Agent System - Multi-agent platform for AI research and content generation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.2",
    "arxiv>=2.1.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.14.2",
    "fastapi>=0.122.0",
    "httpx>=0.28.1",
    "langchain>=1.1.0",
    "langchain-core>=1.1.5",
    "langchain-aws>=1.0.0",
    "langchain-community>=0.4.1",
    "langgraph>=1.0.0",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "sqlalchemy>=2.0.44",
    "tavily-python>=0.5.0",
    "typer>=0.20.0",
    "uvicorn>=0.38.0",
    "wikipedia>=1.4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]
