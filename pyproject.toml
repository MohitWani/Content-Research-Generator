[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "database*"]

[project]
name = "ai-research-agent"
version = "0.1.0"
description = "AI Research Agent - Comprehensive research and content generation system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # FastAPI and web server
    "alembic>=1.16.4",
    "cryptography>=45.0.5",
    "fastapi>=0.116.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.10.1",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0.41",
    "uvicorn>=0.35.0",
    "pyjwt>=2.10.1",
    "email-validator>=2.2.0",
    "aiocache[redis]>=0.12.2",
    # LangChain and LLM
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-aws>=0.2.0",
    "langchain-community>=0.3.0",
    "boto3>=1.35.0",
    # External API clients
    "httpx>=0.28.0",
    "tavily-python>=0.5.0",
    "langchain-tavily>=0.1.0",
    "beautifulsoup4>=4.12.0",
    "arxiv>=2.1.0",
    "wikipedia>=1.4.0",
    # Testing
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
]

[dependency-groups]
dev = [
    "colorlog>=6.8.0",
    "ruff>=0.12.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".venv",
    "migrations",
    "scripts",
    "__pycache__",
    "build",
    "dist",
    "custom_tools",
    "app/utils/flair_recognizer.py"
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
fixable = ["ALL"]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]
